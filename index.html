 <div className="bg-slate-800/70 rounded-lg p-3 space-y-2"><h3 className="font-semibold text-amber-400">Best team</h3>

  <p className="text-xs text-slate-500">Rule-based scoring (Effort Levels, Alpha, level, type coverage). Mode targets are simplified assumptions. No AI involved.</p></div></div>`}
function Satchel({s,set}){
 const D={slots:20,used:0,cost:""},sa={...D,...s.sat},inv=s.inv||{};
 const up=(k,v)=>set(p=>({...p,sat:{...D,...p.sat,[k]:v}})),cs=(k,v)=>set(p=>({...p,inv:{...p.inv,[k]:Math.max(0,v||0)}}));
 const R=CR.map(r=>({n:r[0],c:r[1],t:+r[2],g:r[3]==="-"?[]:r[3].split(",").map(x=>x.split(":")),w:r[4]}));
 const mats=[...new Set(R.flatMap(r=>r.g.map(x=>x[0])))];
 const can=r=>r.g.length?Math.min(...r.g.map(([k,n])=>Math.floor((inv[k]||0)/n))):null;
 const low=R.filter(r=>(inv[r.n]||0)<r.t);
 const num=(v,f)=>h`<input type="number" min="0" value=${v} onInput=${e=>f(+e.target.value)} className=${IN+" w-24"}/>`;
 return h`<div className="space-y-3">
  <div className="bg-slate-800/70 rounded-lg p-3"><h3 className="font-semibold text-amber-400 mb-2">Satchel</h3>
   <div className="flex flex-wrap gap-4 text-sm items-center"><label>Slots (20–60) ${num(sa.slots,v=>up("slots",Math.min(60,Math.max(20,v||20))))}</label><label>Used ${num(sa.used,v=>up("used",v))}</label><span>Free: ${sa.slots-sa.used}</span><label>Next upgrade cost ${num(sa.cost,v=>up("cost",v))}</label></div>
   <p className="text-xs text-slate-400 mt-2">Total cost 20→60 slots: 4,399,500. Suggested stop: 35–40 slots (costs escalate past 40, reaching 1,000,000 for slot 60). Per-slot prices weren’t in the data, so enter Bagin’s quoted price.</p></div>
  ${low.length?h`<div className="bg-red-900/40 border border-red-700 rounded-lg p-3 text-sm">Low stock: ${low.map(r=>r.n).join(", ")}</div>`:null}
  ${R.map(r=>{const n=inv[r.n]||0,lo=n<r.t,c=can(r);return h`<div key=${r.n} className=${"rounded-lg p-3 border "+(lo?"border-amber-600 bg-slate-800":"border-slate-700 bg-slate-800/70")}>
   <div className="flex flex-wrap items-center gap-3"><b>${r.n}</b><span className="text-xs text-slate-400">${r.c} · restock below ${r.t}</span>${lo?h`<span className=${"text-xs px-2 rounded "+(n===0?"bg-red-600":"bg-amber-600")}>Low Stock Alert</span>`:null}<span className="ml-auto">${num(n,v=>cs(r.n,v))}</span></div>
   <div className="text-xs text-slate-300 mt-1">${r.g.length?"Recipe: "+r.g.map(([k,q])=>q+" "+k).join(" + ")+" · can craft now: "+c:"Not craftable"}</div><div className="text-xs text-slate-400">${r.w}</div></div>`})}
  <h3 className="font-semibold text-amber-400">Raw materials</h3><div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">${mats.map(k=>h`<label key=${k} className="flex justify-between items-center gap-2 bg-slate-800/70 rounded p-2">${k}${num(inv[k]||0,v=>cs(k,v))}</label>`)}</div></div>`}
function Shiny(){const [o,so]=useState({r:0,p:0,c:0,x:0});
 const n=1+(o.p?3:o.r?1:0)+(o.c?3:0)+o.x,pr=1-Math.pow(1-1/4096,n);
 const cb=(k,l)=>h`<label className="flex gap-2 mb-2"><input type="checkbox" checked=${!!o[k]} onChange=${e=>so({...o,[k]:e.target.checked?1:0})} className="accent-amber-500"/>${l}</label>`;
 return h`<div>${cb("r","Research Level 10 on this species (+1 roll)")}${cb("p","Perfected entry (+3 rolls total, includes Lv. 10)")}${cb("c","Shiny Charm (+3 rolls)")}
 <select value=${o.x} onChange=${e=>so({...o,x:+e.target.value})} className=${IN+" mb-3"}><option value="0">No outbreak</option><option value="25">Mass Outbreak (+25)</option><option value="12">Massive Mass Outbreak (+12)</option></select>
 <div className="text-3xl font-bold text-amber-400">1 in ${(1/pr).toFixed(1)}</div><div className="text-sm text-slate-400">${n} rolls at 1/4096 each · ${(pr*100).toFixed(2)}% per encounter</div>
 <ul className="list-disc pl-5 text-sm mt-4 space-y-1"><li>Shinies chime and sparkle in the overworld before battle.</li><li>Keep Autosave off and save manually when you hear the chime; reloading keeps the same spawn.</li><li>Static Alphas reroll each time you return to Jubilife Village and re-enter the region.</li></ul></div>`}
function Stars({s,set}){const pts=+((s.m||{}).pts)||0,i=SR.filter(r=>pts>=+r[1]).length-1,nx=SR[i+1];
 return h`<div><label className="text-sm">Research points <input type="number" min="0" value=${pts} onInput=${e=>{const v=+e.target.value;set(p=>({...p,m:{...p.m,pts:v}}))}} className=${IN+" w-28 ml-2"}/></label>
 <p className="my-3">${i<0?"Below 1 Star":SR[i][0]+" · obey up to Lv. "+SR[i][2]}${nx?" · "+(nx[1]-pts)+" pts to "+nx[0]:" · max rank"}</p><${Tbl} head=${["Rank","Points","Obey Lv.","Unlocks"]} rows=${SR}/></div>`}
const Sec=({t,l})=>h`<div className="mb-4"><h3 className="font-semibold text-amber-400 mb-1">${t}</h3><ul className="list-disc pl-5 text-sm space-y-1">${l.map((x,i)=>h`<li key=${i}>${x}</li>`)}</ul></div>`;
const Doc=S=>()=>h`<div>${S.map(([t,l])=>h`<${Sec} key=${t} t=${t} l=${l}/>`)}</div>`;
const PATH=Doc([["Unlock",["Complete Request 102 (Daybreak), then talk to Gared at the Jubilife Village Training Grounds."]],["Rules",["1-on-1 single-species challenge against a fixed opponent.","Items cannot be used in battle.","Each cleared species gets a Pokédex mark (not needed for Shiny Charm or Arceus, needed for true 100%)."]],["Winning formula",["Raise HP, defenses and main attacking stat to Effort Level 9–10 with Grit.","Use Zisu’s tutor for coverage or healing (Recover, Roost, Rest, Drain Punch, Leech Life).","Weak babies (Magikarp, Wurmple, Abra, Kricketot, Unown, Burmy): Lv. 80–100, EL 10, Agile Style status/stat moves or Struggle."]],["Hardest trials",["Magikarp vs Lv. 50 Electrode: Lv. 90+, EL 10 HP/Def/SpDef; survive Self-Destruct or Splash until Struggle.","Wurmple vs Lv. 30 Staravia: Lv. 85+, EL 10 HP/Def/Atk; Poison Sting, outlast with Tackle.","Kricketot vs Lv. 40 Cherrim: Lv. 85+, EL 10; teach Struggle Bug and spam it.","Abra vs Lv. 45 Mr. Mime: Lv. 85+, EL 10; teach Shadow Ball.","Unown vs Lv. 55 Gastly, Haunter & Gengar (3v1): Lv. 90+, EL 10 SpA/Spe/HP; Hidden Power (Psychic)."]]]);
const MECH=Doc([["Differences from mainline",["No breeding or eggs.","No held items or abilities in battle (exceptions: Regigigas’s Slow Start, Cherrim’s Flower Gift).","Effort Levels 0–10 via Grit replace EVs/IVs (IVs set the starting EL).","Evolution is triggered manually from the satchel/party menu."]],["Action speed",["Hidden Action Time counter decides turn order; higher Speed shortens recovery so fast Pokémon can act repeatedly.","Standard moves cost 8; priority moves (Quick Attack, Aqua Jet, Ice Shard, Bullet Punch, Mach Punch) cost 5; heavy moves (Hyper Beam, Giga Impact, Roar of Time, Self-Destruct) cost 11–12."]],["Move mastery",["Master a move by leveling roughly 10 past its learn level, or feed a Seed of Mastery at Zisu’s Training Grounds.","Agile Style: 0.8× power, recovery −3 (often an immediate extra turn), 2 PP.","Strong Style: 1.2× power (1.25× on weak moves), +10–20% accuracy and secondary chance, recovery +5, 2 PP."]],["Research",["Each task is 1 point toward Level 10; double-arrow tasks give 2.","Lv. 10 on all 239 required species unlocks the Shiny Charm.","Finishing every task on a species marks it Perfect and adds shiny rolls for it."]],["Alphas",["At least three 31-IV stats (start at EL 3+ in those).","Spawn with a mastered tutor move.","Drop Seeds of Mastery, Exp. Candy and Grit.","Static Alphas respawn when you return to Jubilife Village and re-enter the region."]],["Ride unlocks",["Wyrdeer (M5), Ursaluna (M8), Basculegion (M10), Sneasler (M11), Braviary (M12)."]]]);
const NEW={dex:Dex,types:TypesTab,roster:Roster,sat:Satchel,shiny:Shiny,stars:Stars,path:PATH,mech:MECH};

const KEY="pla-companion-v1";
function Row({r,s,set}){const on=!!(s.c||{})[r.id];
 return h`<details className="bg-slate-800/70 rounded-lg border border-slate-700 mb-2"><summary className="flex items-center gap-3 p-3 cursor-pointer">
 <input type="checkbox" checked=${on} onClick=${e=>e.stopPropagation()} onChange=${()=>set(p=>({...p,c:{...p.c,[r.id]:!(p.c||{})[r.id]}}))} className="w-5 h-5 accent-amber-500"/>
 <div className="flex-1 min-w-0"><div className=${on?"line-through opacity-60":"font-medium"}>${r.t}</div><div className="text-xs text-slate-400">${r.sub}</div></div></summary>

function Bar({l,v,m}){return h`<div className="mb-3"><div className="flex justify-between text-sm"><span>${l}</span><span>${v}/${m}</span></div><div className="h-2 bg-slate-700 rounded"><div className="h-2 rounded bg-amber-500" style=${{width:(m?Math.min(100,v/m*100):0)+"%"}}></div></div></div>`}

function App(){
 const [s,set]=useState(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}});
 const [tab,setTab]=useState("dash"),[q,setQ]=useState(""),[imp,setImp]=useState(""),[gq,setGq]=useState(""),[rs,setRs]=useState(false);
 useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}},[s]);

 const tabs=[["dash","Dashboard"],["story","Story"],["nob","Nobles"],["leg","Legendaries"],["dex","Pokédex"],["evo","Evolutions"],["roster","Roster"],["sat","Satchel"],["shiny","Shiny"],["types","Types"],["stars","Stars"],["shop","Shops"],["req","Requests"],["wisp","Wisps"],["uno","Unown"],["ver","Verses"],["path","Solitude"],["mech","Mechanics"],["bk","Backup"]];
 let body;

 const omni=h`<div className="mb-3"><input placeholder="Search everything…" value=${gq} onInput=${e=>setGq(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded p-2"/>${res.map(([k,n,t],i)=>h`<button key=${i} onClick=${()=>{setTab(k);setQ(gq);setGq("")}} className="block w-full text-left text-sm p-2 border-b border-slate-800">${t} <span className="text-slate-400">· ${n}</span></button>`)}</div>`;

  <${Bar} l="Legendary/Mythical (18)" v=${cnt("l")} m=${LEG.length}/><${Bar} l="Spiritomb Wisps" v=${cnt("w")} m=${WL.length}/><${Bar} l="Unown Forms" v=${cnt("u")} m=${UNO.length}/><${Bar} l="Old Verses" v=${cnt("v")} m=${VER.length}/><${Bar} l="Key Requests (of 122)" v=${cnt("r")} m=${REQ.length}/><${Bar} l="Story Missions (27)" v=${cnt("s")} m=${MIS.length}/><${Bar} l="Noble Pokémon (5)" v=${cnt("n")} m=${NOB.length}/><${Bar} l="Evolutions Done" v=${cnt("e")} m=${EVO.length}/></div>`;
 else if(tab==="shop")body=h`<div><h2 className="font-semibold text-amber-400 mb-2">Ginter (Ginkgo Guild)</h2><${Tbl} head=${["Disguised","Real item","Cost"]} rows=${GIN}/>

 else if(NEW[tab]){const C=NEW[tab];body=h`<${C} s=${s} set=${set}/>`}

 else{const L=LISTS[tab],rows=L.rows.filter(r=>(r.t+r.sub+r.body).toLowerCase().includes(q.toLowerCase()));
  body=h`<div><${Bar} l=${L.n} v=${cnt(L.p)} m=${L.rows.length}/><input placeholder="Search…" value=${q} onInput=${e=>setQ(e.target.value)} className="w-full mb-3 bg-slate-900 border border-slate-700 rounded p-2"/>${rows.map(r=>h`<${Row} key=${r.id} r=${r} s=${s} set=${set}/>`)}</div>`}
 return h`<div className="max-w-3xl mx-auto p-4"><h1 className="text-2xl font-bold text-amber-400 mb-1">Hisui Completionist Companion</h1>${omni}

ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script></body></html>
