html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{background:#0f1419;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.pre{white-space:pre-line}
input,select,textarea{font-size:16px}
button{touch-action:manipulation}
.card{background:rgba(30,41,59,.65);border:1px solid #334155;border-radius:14px}
.card-red{background:rgba(127,29,29,.35);border:1px solid #dc2626;border-radius:14px}
.card-amb{background:rgba(120,53,15,.3);border:1px solid #d97706;border-radius:14px}
.card-grn{background:rgba(20,83,45,.3);border:1px solid #16a34a;border-radius:14px}
.lnk{color:#fbbf24;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.btn{background:#d97706;color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;min-height:40px}
.btn2{background:#334155;color:#e2e8f0;border-radius:10px;padding:8px 14px;min-height:40px}
.btn-s{width:38px;min-height:40px;border-radius:10px;background:#334155;font-size:20px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:14px;background:#1e293b;border:1px solid #334155;position:relative;color:#e2e8f0}
.chip.on{background:#d97706;border-color:#d97706;color:#fff}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;background:#334155;color:#cbd5e1}
.tag.red{background:#b91c1c;color:#fff}
.tag.grn{background:#166534;color:#fff}
.tag.amb{background:#b45309;color:#fff}
.dot{position:absolute;top:-3px;right:-4px;width:11px;height:11px;border-radius:99px;background:#ef4444;border:2px solid #0f1419}
.dot.a{background:#f59e0b}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0b1017;border-top:1px solid #334155;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
.bnav-in{display:flex;width:100%;max-width:768px}
.bnav button{flex:1;position:relative;padding:8px 2px 6px;font-size:11px;color:#94a3b8}
.bnav button.on{color:#fbbf24}
.bnav .ic{font-size:21px;display:block;line-height:1.1;position:relative;width:fit-content;margin:0 auto}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#111827;border:1px solid #334155;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(15,20,25,.97)}
.row-pg{height:8px;background:#334155;border-radius:99px;overflow:hidden}
.row-pg>div{height:8px;border-radius:99px;background:#f59e0b}</style></head>

 if(/farm harvest/i.test(w))o.push({k:"farm",t:"Harvest it from your Jubilife farm (more fields come from Miller's requests #27, #42, #60)"});
 if(/trees/i.test(w))o.push({k:"tree",t:"Shake the trees (berry or Apricorn trees in every area)"});
 const m=w.match(/((?:red|grey|blue)(?:(?:,| and|, and) (?:red|grey|blue))*) ore deposits/i);if(m)o.push({k:"ore",t:"Mine "+m[1].match(/red|grey|blue/gi).join(", ")+" ore deposits"});
 const fl=w.match(/(haystacks[^,;]*|leaf piles[^,;]*|snow piles[^,;]*|floor in [^,;]*)/gi);if(fl)o.push({k:"floor",t:"Pick it up in the field: "+[...new Set(fl.map(x=>x.trim()))].join("; ")});
 if(/dug up by Ursaluna/i.test(w))o.push({k:"dug",t:"Have Ursaluna dig it up (random chance)"});
 if(/Massive Mass Outbreak/i.test(w))o.push({k:"outb",t:"Massive Mass Outbreak rewards"});
 if(/dropped by|carried by/i.test(w))o.push({k:"drop",t:"Some wild Pokémon carry it (names are in the item pop-up)"});
 return o.sort((a,b)=>WAYP[a.k]-WAYP[b.k])};
function Farm({s,set}){
 const N=needs(s),PG=N.PG,c=s.c||{};
 const sh=Object.keys(N.gross).filter(k=>N.gross[k]>cntOf(s,k)).map(k=>({k,need:N.gross[k]-cntOf(s,k),for:(N.fm[k]||[]).join(", ")})).concat(N.oth.map(x=>({k:x.n,need:x.t-x.have,for:"your target of "+x.t}))).sort((a,b)=>b.need-a.need);
 const easy=[],trip=[],locked=[];
 sh.forEach(x=>{const w=waysFor(x.k,s),av=avail(x.k,PG),y={...x,w,av},ez=w.some(z=>z.k==="req"||z.k==="shop"||z.k==="farm"||z.k==="tree");(!av.ok&&!ez?locked:ez?easy:trip).push(y)});
 const hauls=Object.entries(REQD).filter(([n])=>!c["r"+n]).map(([n,d])=>({n:+n,d,big:d.it.filter(x=>x.q>=20)})).filter(x=>x.big.length).sort((a,b)=>b.big.reduce((t,x)=>t+x.q,0)-a.big.reduce((t,x)=>t+x.q,0)).slice(0,8);
 const grow=[27,42,60,23,43,61,71].filter(n=>!c["r"+n]&&REQD[n]);
 const card=x=>h`<div key=${x.k} className="card p-3"><div className="flex items-center gap-2 flex-wrap"><b><${IL} n=${x.k}/></b><span className="text-sm text-amber-300">need ${x.need} more</span>${!x.av.ok?h`<span className="tag">area locked</span>`:null}</div><div className="text-xs text-slate-500">for ${x.for||"your list"}</div>
  ${x.w.length?h`<ol className="text-sm mt-1 space-y-1">${x.w.slice(0,5).map((z,i)=>h`<li key=${i} className=${i===0?"text-green-300":"text-slate-300"}>${i===0?"Best: ":""}${z.t}${z.act?" (active)":""}${z.go?h` <button className="lnk" onClick=${()=>GO(z.go[0],z.go[1])}>open ›</button>`:null}</li>`)}</ol>`:h`<div className="text-xs text-slate-400 mt-1">No source saved yet. Tap the item name to add a note.</div>`}</div>`;
 const grp=(t,sub,l)=>l.length?h`<div className="space-y-2"><div><div className="font-semibold text-amber-400">${t} (${l.length})</div><div className="text-xs text-slate-400">${sub}</div></div>${l.slice(0,20).map(card)}${l.length>20?h`<div className="text-xs text-slate-400">${l.length-20} more not shown.</div>`:null}</div>`:null;
 return h`<div className="space-y-4">
  <div className="card p-3 text-sm text-slate-300">This guide only covers what you are short of right now (from your counts and targets). Count your items in Setup or Satchel first. Fix your area and progress in <button className="lnk" onClick=${()=>GO("need")}>To Get</button>.</div>
  ${sh.length?null:h`<div className="card-grn p-3 text-sm"><b>Nothing to farm.</b> Everything you track is at or above target.</div>`}
  ${grp("Do now","You can get these without a long trip: a request, the shop, your farm or trees.",easy)}
  ${grp("Needs a trip","Mining, picking up in the field or Pokémon drops. Use Here to plan the area.",trip)}
  ${grp("Not reachable yet","These need an area you have not opened.",locked)}
  ${hauls.length?h`<div className="card p-3"><div className="font-semibold text-amber-400 mb-1">Big hauls from requests</div><div className="text-xs text-slate-400 mb-1">Unfinished requests that give 20 or more of an item. Start the ones you can, then finish them for the stock.</div>${hauls.map(x=>h`<${RqRow} key=${x.n} n=${x.n} d=${x.d} s=${s} set=${set}/>`)}</div>`:null}
  ${grow.length?h`<div className="card p-3"><div className="font-semibold text-amber-400 mb-1">Grow your farm and shop</div><div className="text-xs text-slate-400 mb-1">Miller's requests add farm fields. Choy's requests add goods to the general store.</div>${grow.map(n=>h`<${RqRow} key=${n} n=${n} d=${REQD[n]} s=${s} set=${set}/>`)}</div>`:null}
  <div className="card p-3 text-sm space-y-1"><div className="font-semibold text-amber-400">Farming habits</div><div>• Buy what the shop sells when you have the money instead of farming it. Plan it in <button className="lnk" onClick=${()=>GO("buy")}>Buy Planner</button>.</div><div>• Only farm the raw materials you are missing for items below target. To Get adds that up for you.</div><div>• Keep targets small in Stock so you do not farm more than you will use.</div><div>• Craft at a camp bench so raw materials stay in storage and your satchel stays free.</div></div></div>`}

function App(){
 const [s,set]=useState(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}});
 const [tab,setTab]=useState("dash"),[q,setQ]=useState(""),[imp,setImp]=useState(""),[gq,setGq]=useState(""),[rs,setRs]=useState(false),[foc,setFoc]=useState({tab:"dash",n:0}),[hist,setHist]=useState([]),[sheets,setSheets]=useState([]),[last,setLast]=useState({}),[quick,setQuick]=useState(null),[rf,setRf]=useState("all"),[svd,setSvd]=useState(false);
 useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}},[s]);
 useEffect(()=>{const c=s.c||{},add={};(s.ro||[]).forEach(m=>{const d=DEX.find(x=>x.n.toLowerCase()===String(m.n).trim().toLowerCase());if(d){if(!c["dc"+d.i])add["dc"+d.i]=true;if(m.al&&!c["da"+d.i])add["da"+d.i]=true}});if(Object.keys(add).length)set(p=>({...p,c:{...p.c,...add}}))},[s.ro]);
 useEffect(()=>{setSvd(true);const t=setTimeout(()=>setSvd(false),1300);return()=>clearTimeout(t)},[s]);
 useEffect(()=>{try{document.documentElement.style.fontSize={n:"16px",l:"18px",x:"20px"}[s.ts||"n"]}catch(e){}},[s.ts]);
 useEffect(()=>{const g=TABG[tab];if(g)setLast(l=>({...l,[g]:tab}))},[tab]);
 const cnt=p=>Object.keys(s.c||{}).filter(k=>s.c[k]&&k[0]===p).length;
 const dots=DOTS(s),PG=prog(s),top=()=>{try{window.scrollTo(0,0)}catch(e){}};
 const go=(t,o)=>{setHist(a=>[...a.slice(-6),{tab,foc}]);setTab(t);setFoc({...(o||{}),tab:t,n:FN++});setQ("");setRf("all");setSheets([]);setGq("");top()};
 const nav=t=>{setHist([]);setTab(t);setFoc({tab:t,n:FN++});setQ("");setRf("all");setSheets([]);setGq("");top()};
 const back=()=>{const l=hist[hist.length-1];if(!l)return;setHist(a=>a.slice(0,-1));setTab(l.tab);setFoc({...l.foc,n:FN++});setSheets([]);top()};
 const openItem=n=>setSheets(a=>a[a.length-1]===n?a:[...a,n]);
 GO=go;ITEM=openItem;QK=m=>setQuick(m||"catch");
 const ql=gq.toLowerCase();
 const res=gq.length>1?[
  ...IDB.filter(x=>x.n.toLowerCase().includes(ql)).slice(0,4).map(x=>({k:"_item",l:"Item",t:x.n,n:x.n})),
  ...Object.entries(LISTS).flatMap(([k,L])=>L.rows.filter(r=>(r.t+" "+r.sub+" "+r.body).toLowerCase().includes(ql)).slice(0,3).map(r=>({k,l:L.n,t:r.t,id:r.id}))),
  ...DEX.filter(d=>d.n.toLowerCase().includes(ql)).slice(0,3).map(d=>({k:"dex",l:"Pokédex",t:"#"+d.i+" "+d.n,i:d.i}))].slice(0,14):[];
 const pick=r=>{setGq("");if(r.k==="_item")openItem(r.n);else if(r.k==="dex")go("dex",{i:r.i});else go(r.k,{id:r.id})};
 const fo=foc.tab===tab?foc:{};
 let body;
 if(tab==="shop")body=h`<div><h2 className="font-semibold text-amber-400 mb-2">Ginter (Ginkgo Guild)</h2><${Tbl} head=${["Disguised","Real item","Cost"]} rows=${GIN.map(r=>[r[0],LK(r[1]),r[2]])}/>
  <h2 className="font-semibold text-amber-400 mb-2">Simona’s Trading Post (Merit Points)</h2><${Tbl} head=${["Item","MP","Evolves"]} rows=${SIM.map(r=>[LK(r[0]),r[1],r[2]])}/>
  <h2 className="font-semibold text-amber-400 mb-2">Zisu’s Move Tutor</h2><${Tbl} head=${["Move","Type","Priority","Why"]} rows=${ZIS}/></div>`;
 else if(NEW[tab]){const C=NEW[tab];body=h`<${C} key=${foc.n} s=${s} set=${set} fo=${fo}/>`}
 else if(tab==="bk")body=h`<div className="space-y-3"><p className="text-sm text-slate-300">Your progress is saved in this browser only. Copy or download a backup now and then. To restore, paste a backup below and press Import.</p>
  <div className="flex items-center gap-2 flex-wrap text-sm">Text size${[["n","Normal"],["l","Large"],["x","Extra large"]].map(([k,l])=>h`<button key=${k} className=${"chip "+((s.ts||"n")===k?"on":"")} onClick=${()=>set(p=>({...p,ts:k}))}>${l}</button>`)}</div>
  <div className="flex gap-2 flex-wrap"><button className="btn" onClick=${()=>{try{navigator.clipboard.writeText(JSON.stringify(s)).then(()=>{set(p=>({...p,bk:{t:Date.now(),n:0}}));alert("Backup copied.")}).catch(()=>alert("Could not copy. Select the text below and copy it by hand."))}catch(e){alert("Could not copy. Select the text below and copy it by hand.")}}}>Copy backup</button><button className="btn2" onClick=${()=>{try{const b=new Blob([JSON.stringify(s)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hisui-backup.json";a.click();set(p=>({...p,bk:{t:Date.now(),n:0}}))}catch(e){alert("Could not download. Use Copy backup instead.")}}}>Download file</button></div>
  <textarea readOnly value=${JSON.stringify(s)} className="w-full h-32 bg-slate-900 border border-slate-700 rounded p-2 text-xs"/>
  <textarea value=${imp} onInput=${e=>setImp(e.target.value)} placeholder="Paste backup JSON here" className="w-full h-32 bg-slate-900 border border-slate-700 rounded p-2 text-xs"/>
  <div className="flex gap-2"><button className="btn" onClick=${()=>{try{set(JSON.parse(imp));setImp("")}catch(e){alert("That isn’t valid backup JSON.")}}}>Import</button><button className="px-4 py-2 rounded-lg bg-red-700 font-semibold" onClick=${()=>{if(rs){set({});setRs(false)}else setRs(true)}}>${rs?"Click again to confirm reset":"Reset all progress"}</button></div></div>`;
 else{const L=LISTS[tab],f1=fo.id,rows=f1?L.rows.filter(r=>r.id===f1):L.rows.filter(r=>(r.t+r.sub+r.body).toLowerCase().includes(q.toLowerCase())).filter(r=>tab!=="req"||rf==="all"||(rf==="act"&&r.rq&&isAct(s,r.rq)&&!(s.c||{})[r.id])||(rf==="new"&&!(s.c||{})[r.id]&&!(r.rq&&isAct(s,r.rq)))||(rf==="done"&&(s.c||{})[r.id]));
  body=h`<div><${Bar} l=${L.n} v=${cnt(L.p)} m=${L.rows.length}/>${f1?h`<div className="card-amb p-2 mb-2 flex items-center gap-2 text-sm"><span>Showing 1 entry</span><button className="btn2 ml-auto" onClick=${()=>setFoc({tab,n:FN++})}>Show all ${L.rows.length}</button></div>`:h`<input placeholder="Search this list…" value=${q} onInput=${e=>setQ(e.target.value)} className=${IN+" w-full mb-3"}/>`}${tab==="req"&&!f1?h`<div className="flex flex-wrap gap-2 mb-3">${[["all","All"],["act","Active"],["new","Not started"],["done","Done"]].map(([k,l])=>h`<button key=${k} className=${"chip "+(rf===k?"on":"")} onClick=${()=>setRf(k)}>${l}</button>`)}</div>`:null}${rows.map(r=>h`<${Row} key=${r.id} r=${r} s=${s} set=${set} fo=${f1?{id:f1}:null}/>`)}</div>`}
 const gk=TABG[tab]||"home",G0=GROUPS.find(g=>g[0]===gk)||GROUPS[0],dt=k=>dots[k]?h`<span className=${"dot "+(dots[k]==="a"?"a":"")}></span>`:null;
 return h`<div><div className="hdr px-3 py-2"><div className="max-w-3xl mx-auto flex items-center gap-2">
   ${hist.length?h`<button className="btn2 px-3" onClick=${back}>←</button>`:null}
   <div className="relative flex-1 min-w-0"><input placeholder="Search items, Pokémon, missions…" value=${gq} onInput=${e=>setGq(e.target.value)} className=${IN+" w-full"}/>
    ${res.length?h`<div className="absolute left-0 right-0 top-full mt-1 card max-h-[60vh] overflow-y-auto z-50" style=${{background:"#111827"}}>${res.map((r,i)=>h`<button key=${i} onClick=${()=>pick(r)} className="block w-full text-left text-sm p-3 border-b border-slate-800">${r.t} <span className="text-slate-400">· ${r.l}</span></button>`)}</div>`:null}</div>
   <span className=${"text-xs shrink-0 "+(svd?"text-green-400":"text-transparent")}>✓</span>
   <button className="btn shrink-0 px-3" onClick=${()=>setQuick("catch")}>＋</button>
   <button className="chip shrink-0" onClick=${()=>go("need")}>${PG.gate>27?"Done":"M"+PG.gate} · ★${PG.rk}</button></div></div>
  <div className="max-w-3xl mx-auto px-3 pb-28" onTouchStart=${e=>{const q=e.touches[0];window.__sw={x:q.clientX,y:q.clientY,ok:!e.target.closest("input,textarea,select,.overflow-x-auto")}}} onTouchEnd=${e=>{const a=window.__sw;window.__sw=null;if(!a||!a.ok)return;const q=e.changedTouches[0],dx=q.clientX-a.x,dy=q.clientY-a.y;if(Math.abs(dx)>90&&Math.abs(dy)<40){const L=G0[3],i=L.findIndex(x=>x[0]===tab),j=i+(dx<0?1:-1);if(L.length>1&&i>=0&&L[j])nav(L[j][0])}}}>
   <div className="pt-2 pb-1 text-xs text-slate-500">${G0[2]} ${G0[1]}${TABN[tab]&&G0[3].length>1?" › "+TABN[tab]:""}</div>
   ${G0[3].length>1?h`<div className="flex flex-wrap gap-2 pb-3">${G0[3].map(([k,n])=>h`<button key=${k} className=${"chip "+(tab===k?"on":"")} onClick=${()=>nav(k)}>${n}${dt(k)}</button>`)}</div>`:null}
   ${body}</div>
  <div className="bnav"><div className="bnav-in">${GROUPS.map(g=>h`<button key=${g[0]} className=${gk===g[0]?"on":""} onClick=${()=>nav(gk===g[0]?g[3][0][0]:(last[g[0]]||g[3][0][0]))}><span className="ic">${g[2]}${dt(g[0])}</span>${g[1]}</button>`)}</div></div>
  ${sheets.length?h`<${Sheet} n=${sheets[sheets.length-1]} s=${s} set=${set} close=${()=>setSheets([])} back=${sheets.length>1?()=>setSheets(a=>a.slice(0,-1)):null}/>`:null}
  ${quick?h`<${Quick} m0=${quick} s=${s} set=${set} close=${()=>setQuick(null)}/>`:null}</div>`}

ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script></body></html>
